<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H3 Globe — @felipeandres254</title>
  <link rel="icon" type="image/png" href="https://files.felipeandres254.io/io.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
</head>
<body>
  <div id="map"></div>

  <div class="hud hud-top">
    <span class="hud-item" id="hud-point">hover to highlight a cell · click to inspect</span>
  </div>

  <div class="hud hud-bottom">
    <div class="hud-group">
      <label class="hud-label" for="hud-res">resolution</label>
      <input class="hud-range" id="hud-res" type="range" min="0" max="15" step="1" value="2">
      <span class="hud-item" id="hud-res-val">2</span>
    </div>
    <div class="hud-group">
      <label class="hud-label" for="hud-k">ring k</label>
      <input class="hud-range" id="hud-k" type="range" min="0" max="4" step="1" value="2">
      <span class="hud-item" id="hud-k-val">2</span>
    </div>
    <button class="hud-item hud-btn" id="hud-reset" type="button">reset view</button>
  </div>

  <div id="info" class="info" style="display:none">
    <button class="info-close" id="info-close">×</button>
    <div class="info-row info-id">index <b id="info-id">—</b></div>
    <div class="info-row">point <b id="info-point">—</b></div>
    <div class="info-row">center <b id="info-center">—</b></div>
    <div class="info-row">res <b id="info-res">—</b></div>
    <div class="info-row">area <b id="info-area">—</b></div>
    <div class="info-row">base cell <b id="info-base">—</b></div>
    <div class="info-row">pentagon <b id="info-pent">—</b></div>
    <button class="hud-btn" id="info-copy" type="button">copy index</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
